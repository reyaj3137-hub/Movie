<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Online</title>

    <!-- Clickadu Verification Meta Tag -->
    <meta name="clckd" content="c2e127108c4ae050ddcef22f06ddc7af" />
    
    <!-- Social Media Sharing Meta Tags -->
    <meta property="og:title" content="Click To Watch Online">
    <meta property="og:description" content="Click the button to open full website.">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 10px 0;
        }

        /* 300x250 Video Ad Spaces */
        .ad-space {
            width: 300px;
            height: 250px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        /* Main Container */
        .main-container {
            max-width: 360px;
            width: 90%;
            margin: 5px auto;
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* Animated Pointer */
        .pointer-container {
            margin: 4px 0;
        }

        .pointer-icon {
            font-size: 36px;
            display: inline-block;
            animation: bounce 1.2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        /* Glowing Light Button */
        .btn-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            border-radius: 50px;
            padding: 4px;
            background: linear-gradient(90deg, #ff007f, #7928ca, #00f2fe, #ff007f);
            background-size: 300% 300%;
            animation: glowingBorder 3s infinite linear;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5), 0 0 35px rgba(121, 40, 202, 0.4);
        }

        @keyframes glowingBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 15px;
            background-color: #101625;
            color: #ffffff;
            text-decoration: none;
            border-radius: 46px;
            transition: transform 0.2s ease, background 0.3s;
        }

        .main-btn:active, .main-btn:hover {
            transform: scale(0.98);
            background-color: #172036;
        }

        .btn-text-primary {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-text-secondary {
            font-size: 13px;
            color: #00f2fe;
            margin-top: 3px;
            font-weight: 500;
        }

        .click-note {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- TOP VIDEO AD SPACE -->
    <div class="ad-space" id="top-ad">
        <!-- ভেরিফিকেশনের পর এখানে Clickadu Video Ad Script বসাবেন -->
    </div>

    <!-- MAIN BUTTON CONTAINER -->
    <div class="main-container">
        
        <div class="pointer-container">
            <span class="pointer-icon">👇</span>
        </div>

        <div class="btn-wrapper">
            <a href="https://movie-box-wine-seven.vercel.app/" class="main-btn" target="_blank" rel="noopener noreferrer">
                <span class="btn-text-primary">▶️ মূল ওয়েবসাইট খুলুন</span>
                <span class="btn-text-secondary">Click Here To Open Website</span>
            </a>
        </div>

        <div class="pointer-container">
            <span class="pointer-icon">👆</span>
        </div>

        <p class="click-note">
            সহজে দেখার জন্য উপরের বড় লাইটিং বাটনটিতে চাপ দিন।
        </p>

    </div>

    <!-- BOTTOM VIDEO AD SPACE -->
    <div class="ad-space" id="bottom-ad">
        <!-- ভেরিফিকেশনের পর এখানে Clickadu Video Ad Script বসাবেন -->
    </div>

</body>
</html>
